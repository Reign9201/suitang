# 版本和 Montage 工程保持一致，复用本机已有的依赖缓存
[versions]
agp = "9.4.0"
# AGP 9.4 内置 Kotlin 2.2.10；Compose 编译器插件必须与它同版本
kotlinCompose = "2.2.10"
composeBom = "2025.09.00"
activityCompose = "1.10.1"
lifecycleCompose = "2.10.0"
media3 = "1.4.1"
okHttp = "5.4.0"
gson = "2.14.0"
coil = "2.7.0"
kotlinxCoroutines = "1.11.0"
securityCrypto = "1.0.0"
anthropic = "3.3.0"
junit = "4.13.2"

[plugins]
application = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }

[libraries]
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeMaterialIcons = { module = "androidx.compose.material:material-icons-extended" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycleCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
media3Exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3Ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
okHttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okHttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
coilCompose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
securityCrypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
anthropic = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
junit = { module = "junit:junit", version.ref = "junit" }
