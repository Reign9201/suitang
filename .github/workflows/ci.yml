name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 拒绝不该入库的文件
        run: |
          forbidden=$(git ls-files | grep -Ei \
            '(^|/)config\.json$|(^|/)local\.properties$|(^|/)cache/|\.playwright-mcp/|\.artifact-server\.(json|log)|\.sharing\.json' \
            || true)
          if [ -n "$forbidden" ]; then
            echo "::error::以下文件不应入库（含密钥或本机数据）："
            printf '%s\n' "$forbidden"
            exit 1
          fi

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 拒绝本机路径与公司信息
        run: |
          # 正则用字符类断开自匹配，避免命中本文件里的模式文本
          leaked=$(git grep -nIiE '[z]epp|/User[s]/[a-z0-9_]+' -- . || true)
          if [ -n "$leaked" ]; then
            echo "::error::发现不该入库的本机信息（公司名、本机路径）："
            printf '%s\n' "$leaked"
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 同步合并共用用例
        run: python3 sync.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 单元测试（分类规则与同步合并）
        run: cd android && ./gradlew :app:testDebugUnitTest
