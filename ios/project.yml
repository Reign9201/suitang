name: BiliStudy
options:
  bundleIdPrefix: com.reign.bilistudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  BiliStudy:
    type: application
    platform: iOS
    sources:
      - path: BiliStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reign.bilistudy
        PRODUCT_NAME: BiliStudy
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 随堂
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  BiliStudyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BiliStudyTests
      - path: ../docs/sync-cases.json
        buildPhase: resources
    dependencies:
      - target: BiliStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reign.bilistudy.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BiliStudy.app/BiliStudy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BiliStudy:
    build:
      targets:
        BiliStudy: all
        BiliStudyTests: [test]
    test:
      targets:
        - BiliStudyTests
