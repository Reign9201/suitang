<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>iPad 一句话搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C2B26;text-decoration:none}a:hover{color:#1C2B26}
</style>
</helmet>
<div style="width: 1180px; height: 820px; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; padding: 18px 34px 0; background: #F3F6F3; color: #1C2B26; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <div style="display: flex; align-items: center; gap: 12px; flex: none">
    <a href="Main.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #52605A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <label style="flex: 1; max-width: 640px; height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 18px; border: 1.5px solid #1F5C47; border-radius: 23px; background: #FFFFFF; color: #1C2B26">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64716B" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input type="search" aria-label="搜索" value="我初二，浮力听不懂" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #1C2B26">
    </label>
  </div>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; flex: none">
    <span style="padding: 7px 10px; border-radius: 7px; background: #E5F0EA; color: #1F5C47; font-size: 14px">八年级</span>
    <span style="padding: 7px 10px; border-radius: 7px; background: #E5F0EA; color: #1F5C47; font-size: 14px">物理</span>
    <span style="padding: 7px 10px; border-radius: 7px; background: #E5F0EA; color: #1F5C47; font-size: 14px">下册</span>
    <span style="padding: 7px 10px; border-radius: 7px; background: #E5F0EA; color: #1F5C47; font-size: 14px">浮力</span>
    <a href="Main.dc.html" style="height: 44px; padding: 0 20px; margin-left: 8px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid #1F5C47; border-radius: 12px; background: #1F5C47; color: #FFFFFF; font-size: 15px; font-weight: 500">打开八年级物理下册</a>
  </div>
  <p style="margin: 8px 0 0; font-size: 13px; color: #64716B; flex: none">只搜索 B 站校园学习分区，搜索词「八年级物理下册 浮力」</p>

  <div style="flex: 1; min-height: 0; overflow: hidden; margin-top: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07); padding: 6px 0">
    <sc-for list="{{results}}" as="it" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 14px; box-shadow: {{it.line}}">
        <a href="Player.dc.html" aria-label="{{it.label}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 18px">
          <span style="position: relative; flex: none; width: 176px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #DFE6E2">
            <img src="{{it.cover}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <span style="position: absolute; right: 7px; bottom: 7px; padding: 4px 7px; border-radius: 6px; background: rgba(14,26,22,0.74); color: #FFFFFF; font-size: 12px; line-height: 1; font-variant-numeric: tabular-nums">{{it.len}}</span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 16px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.title}}</span>
            <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 13px; color: #52605A">
              <span>{{it.author}}</span>
              <span>{{it.plays}}</span>
              <span style="padding: 5px 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px #E2E8E4; font-size: 12px; line-height: 1">{{it.where}}</span>
            </span>
          </span>
        </a>
        <button onClick="{{it.toggle}}" aria-label="{{it.saveLabel}}" style="flex: none; width: 44px; height: 44px; margin-right: 8px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: none; color: {{it.saveColor}}; cursor: pointer">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="{{it.saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { saved: {} };
  }
  renderVals() {
    var self = this;
    function r(id, cover, title, author, plays, len, where, first) {
      var saved = !!self.state.saved[id];
      var shortTitle = title.length > 24 ? title.slice(0, 24) + '…' : title;
      return {
        cover: cover, title: title, author: author, plays: plays, len: len, where: where,
        label: [title, author, plays, '时长 ' + len].join('，'),
        line: first ? 'none' : 'inset 14px 0 0 0 #E2E8E4',
        saveLabel: (saved ? '取消收藏：' : '收藏：') + shortTitle, saveColor: saved ? '#C23B2B' : '#64716B', saveFill: saved ? '#C23B2B' : 'none',
        toggle: function () { var s = Object.assign({}, self.state.saved); s[id] = !saved; self.setState({ saved: s }); }
      };
    }
    return {
      results: [
        r('BV1u5411q7c3', '/_blob/87d5479a04c4df86fe687c944aff2486', '八年级（下）物理（人教版）看这个合集就够了 初中物理 八年级物理 八下物理 力学 受力分析 摩擦力 浮力 压强 杠杆 滑轮 功 功率', '于总CEO', '1975.7 万次播放', '87:41:43', '八年级 物理 下册', true),
        r('BV1us9iBnEw9', '/_blob/878a027062421036c446b858400abbb0', '浮力速算法【全网浮力最强技巧】', 'kangpang学吧', '68.1 万次播放', '28:27', '物理'),
        r('BV1gJ41157Z2', '/_blob/7d6ef715866339efb48501930a546b8e', '初二物理下册课本与习题讲解（八年级下册）', '刘新宇老师', '9.7 万次播放', '7:27:41', '八年级 物理 下册'),
        r('BV1TGLz6aEXJ', '/_blob/649bda427883a4d4fd3ab1b3b9f6915a', '全29集【2026沪粤版八年级下册】沪粤版八年级物理上下册 课本同步精讲（配套讲义习作PDF)', '清北学长李狗蛋', '2.2 万次播放', '43:53:05', '八年级 物理')
      ]
    };
  }
}
</script>
</body>
</html>
