<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>iPad 我的</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C2B26;text-decoration:none}a:hover{color:#1C2B26}
</style>
</helmet>
<div style="width: 1180px; height: 820px; display: flex; overflow: hidden; background: #F3F6F3; color: #1C2B26; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <nav aria-label="年级" style="width: 200px; flex: none; box-sizing: border-box; padding: 26px 22px 20px; background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,0.07), transparent 60%), #1F5C47; color: #F4F0E3; display: flex; flex-direction: column; gap: 24px">
    <a href="Main.dc.html" aria-label="随堂 首页" style="display: flex; align-items: center; gap: 10px; color: #F4F0E3">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 64 64">
        <rect x="4" y="4" width="56" height="56" rx="1.5" fill="none" stroke="#F4F0E3" stroke-width="3"/>
        <g stroke="#F4F0E3" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2.5 2.3">
          <line x1="32" y1="8.5" x2="32" y2="55.5"/><line x1="8.5" y1="32" x2="55.5" y2="32"/>
        </g>
        <path d="M26.2 21.2 L26.2 42.8 L44.9 32 Z" fill="#F4C24D" stroke="#F4C24D" stroke-width="5" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 30px; line-height: 1; letter-spacing: 2px">随堂</span>
    </a>
    <sc-for list="{{stages}}" as="stage" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 500; color: rgba(244,240,227,0.74); letter-spacing: 1.5px">{{stage.name}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, 46px); gap: 9px">
          <sc-for list="{{stage.grades}}" as="g" hint-placeholder-count="3">
            <a href="Main.dc.html" aria-label="{{g.name}}" style="{{g.style}}">{{g.short}}</a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Mine.dc.html" aria-current="page" style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; margin: 0 -12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: #F4F0E3; background: rgba(255,255,255,0.12)">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="#F4C24D" stroke="#F4C24D" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
        我的
      </a>
      <a href="Settings.dc.html" style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; margin: 0 -12px; border-radius: 12px; font-size: 15px; color: #F4F0E3">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(244,240,227,0.74)" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        设置
      </a>
    </div>
  </nav>

  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 26px 34px 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: flex-end; gap: 16px; flex: none">
      <h1 style="margin: 0; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 30px; font-weight: 400; line-height: 1.2">我的</h1>
      <span style="margin-left: auto; padding-bottom: 12px; font-size: 13px; color: #64716B">{{syncText}}</span>
      <button onClick="{{syncNow}}" style="height: 44px; padding: 0 20px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid #E2E8E4; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #1C2B26; cursor: pointer">立即同步</button>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; margin: 28px 0 12px; flex: none">
      <h2 style="margin: 0; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 23px; font-weight: 400">继续学习</h2>
      <span style="font-size: 13px; color: #64716B">{{resumeCount}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; flex: none">
      <sc-for list="{{resume}}" as="r" hint-placeholder-count="2">
        <a href="Player.dc.html" style="display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07)">
          <span style="position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #DFE6E2">
            <img src="{{r.cover}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
          </span>
          <span style="font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 17px; line-height: 1.35; padding: 3px 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.lesson}}</span>
          <span style="font-size: 12px; color: #52605A; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.course}}</span>
          <span style="display: flex; align-items: center; gap: 8px; padding: 4px 6px 6px">
            <span style="flex: 1; height: 5px; border-radius: 3px; background: #E5F0EA; position: relative">
              <span style="{{r.bar}}"></span>
            </span>
            <span style="font-size: 11px; color: #64716B; font-variant-numeric: tabular-nums">{{r.progress}}</span>
          </span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; margin: 30px 0 12px; flex: none">
      <h2 style="margin: 0; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 23px; font-weight: 400">收藏</h2>
      <span style="font-size: 13px; color: #64716B">{{savedCount}}</span>
    </div>
    <div style="flex: 1; min-height: 0; overflow: hidden; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07); padding: 6px 0">
      <sc-if value="{{hasSaved}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{saved}}" as="it" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 14px; box-shadow: {{it.line}}">
            <a href="Player.dc.html" aria-label="{{it.label}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 18px">
              <span style="position: relative; flex: none; width: 160px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #DFE6E2">
                <img src="{{it.cover}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
                <span style="position: absolute; right: 7px; bottom: 7px; padding: 4px 7px; border-radius: 6px; background: rgba(14,26,22,0.74); color: #FFFFFF; font-size: 12px; line-height: 1; font-variant-numeric: tabular-nums">{{it.len}}</span>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 16px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.title}}</span>
                <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 13px; color: #52605A">
                  <span style="padding: 5px 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px #E2E8E4; font-size: 12px; line-height: 1">{{it.where}}</span>
                  <span>{{it.author}}</span>
                  <span>{{it.meta}}</span>
                </span>
              </span>
            </a>
            <button onClick="{{it.remove}}" aria-label="取消收藏" style="flex: none; width: 44px; height: 44px; margin-right: 8px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: none; color: #C23B2B; cursor: pointer">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="#C23B2B" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
            </button>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{noSaved}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 20px 16px; font-size: 15px; color: #52605A">在课程旁点书签就能收藏，换设备登录同一个网盘后也能看到。</p>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: {}, synced: '上次同步 今天 10:42' };
  }
  renderVals() {
    var self = this;
    var kai = "'Kaiti SC', STKaiti, KaiTi, serif";
    function cell(short, name) {
      var line = 'rgba(244,240,227,0.5)';
      return {
        short: short, name: name,
        style: 'width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;' +
          ' border: 1.5px solid ' + line + '; border-radius: 3px; background-color: transparent;' +
          ' background-image: repeating-linear-gradient(90deg, ' + line + ' 0 3px, transparent 3px 6px), repeating-linear-gradient(0deg, ' + line + ' 0 3px, transparent 3px 6px);' +
          ' background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat;' +
          ' font-family: ' + kai + '; font-size: ' + (short.length > 1 ? '17px' : '24px') + '; line-height: 1; color: #F4F0E3'
      };
    }
    var all = [
      { id: 'BV1aP4y1o7n1', cover: '/_blob/ea5789170a2beadbf0d2fbe316ebf58c', len: '21:47:51', title: '【初一数学170讲】七年级数学全集：概念课、习题课 | 最全面的课程 | 持续更新中', where: '七年级 数学', author: '一点老师', meta: '170 集' },
      { id: 'BV1X9jJ6REYN', cover: '/_blob/5d9e0e48e1a12302a4f4b156d15bac54', len: '20:39:55', title: '全189集【初一数学】2026新教材初中数学人教版七年级上册（数学初一七年级上册）', where: '七年级 数学', author: '我在B站逆袭之路', meta: '189 集' },
      { id: 'BV148udzkEih', cover: '/_blob/0bdaef71de2ad10cc8a993ee4ad61824', len: '13:37', title: '《十分钟速通教材》之初一数学上册第一章有理数！10分钟理顺6个考点', where: '七年级 数学', author: '亮亮巧解初中数学', meta: '专题讲解' }
    ];
    var saved = all.filter(function (x) { return !self.state.removed[x.id]; }).map(function (x, i) {
      return Object.assign({}, x, {
        label: [x.title, x.author, x.meta].join('，'),
        line: i === 0 ? 'none' : 'inset 14px 0 0 0 #E2E8E4',
        remove: function () { var r = Object.assign({}, self.state.removed); r[x.id] = true; self.setState({ removed: r }); }
      });
    });
    return {
      stages: [
        { name: '小学', grades: [cell('一', '一年级'), cell('二', '二年级'), cell('三', '三年级'), cell('四', '四年级'), cell('五', '五年级'), cell('六', '六年级')] },
        { name: '初中', grades: [cell('七', '七年级'), cell('八', '八年级'), cell('九', '九年级')] },
        { name: '高中', grades: [cell('高一', '高一'), cell('高二', '高二'), cell('高三', '高三')] }
      ],
      syncText: this.state.synced,
      syncNow: function () { self.setState({ synced: '上次同步 刚刚' }); },
      resume: [
        { cover: '/_blob/1c43bbe290c13f26f32a28f652095afc', lesson: '1.2.1 有理数的概念', course: '【56集全】人教版七上数学新教材教学视频合集', progress: '2/56', bar: 'position: absolute; left: 0; top: 0; bottom: 0; width: 4%; border-radius: 3px; background: #1F5C47' },
        { cover: '/_blob/0bdaef71de2ad10cc8a993ee4ad61824', lesson: '08:15 处中断', course: '《十分钟速通教材》之初一数学上册第一章有理数', progress: '15/20', bar: 'position: absolute; left: 0; top: 0; bottom: 0; width: 75%; border-radius: 3px; background: #1F5C47' }
      ],
      resumeCount: 2,
      saved: saved,
      savedCount: saved.length,
      hasSaved: saved.length > 0,
      noSaved: saved.length === 0
    };
  }
}
</script>
</body>
</html>
