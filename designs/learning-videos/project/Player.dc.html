<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>iPad 播放页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C2B26;text-decoration:none}a:hover{color:#1C2B26}
</style>
</helmet>
<div style="width: 1180px; height: 820px; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; padding: 16px 28px 20px; background: #F3F6F3; color: #1C2B26; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding-right: 12px; font-size: 15px; color: #52605A; flex: none">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    七年级 数学
  </a>

  <div style="flex: 1; min-height: 0; display: flex; gap: 24px; margin-top: 4px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #0E1A16; flex: none; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07)">
        <img src="/_blob/1c43bbe290c13f26f32a28f652095afc" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; display: flex; align-items: center; gap: 14px; background: linear-gradient(transparent, rgba(14,26,22,0.78)); color: #FFFFFF">
          <button aria-label="暂停" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #FFFFFF">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
          <span style="font-size: 13px; font-variant-numeric: tabular-nums">04:12</span>
          <span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 32%; border-radius: 2px; background: #FFFFFF"></span>
          </span>
          <span style="font-size: 13px; font-variant-numeric: tabular-nums">13:02</span>
          <button aria-label="全屏" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #FFFFFF">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <span style="margin-top: 16px; font-size: 13px; color: #64716B">第 3 节，共 56 节</span>
      <h1 style="margin: 2px 0 8px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 30px; font-weight: 400; line-height: 1.35">1.2.1 有理数的概念</h1>
      <p style="margin: 0; font-size: 14px; color: #52605A; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">【56集全】人教版七上数学新教材教学视频合集（初一数学七年级上册）</p>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; font-size: 13px; color: #64716B">
        <span>清北李狗蛋</span><span>56 节</span><span>15.3 小时</span><span>198.1 万次播放</span><span>360P</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px">
        <a href="Player.dc.html" style="height: 44px; padding: 0 20px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid rgba(226,232,228,0.35); border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 500; color: rgba(28,43,38,0.35)">上一节</a>
        <a href="Player.dc.html" style="height: 44px; padding: 0 20px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid #1F5C47; border-radius: 12px; font-size: 15px; font-weight: 500; background: #1F5C47; color: #FFFFFF">下一节</a>
        <button onClick="{{cycleSpeed}}" aria-label="{{speedAria}}" style="height: 44px; padding: 0 18px; box-sizing: border-box; border: 1.5px solid #E2E8E4; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; color: #1C2B26; cursor: pointer">{{speed}}</button>
        <button onClick="{{toggleSave}}" aria-label="{{saveLabel}}" style="height: 44px; padding: 0 18px; display: flex; align-items: center; gap: 8px; box-sizing: border-box; border: 1.5px solid {{saveBorder}}; border-radius: 12px; background: {{saveBg}}; font: inherit; font-size: 15px; font-weight: 500; color: {{saveColor}}; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
          {{saveText}}
        </button>
      </div>
    </div>

    <aside aria-label="目录" style="width: 350px; flex: none; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07); overflow: hidden; margin-bottom: 20px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid #E2E8E4">
        <span style="font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 21px">目录</span>
        <span style="font-size: 13px; color: #C23B2B; font-variant-numeric: tabular-nums">已看完 2 / 56</span>
      </div>
      <div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 0">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
          <div style="padding: 12px 16px 4px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 16px; color: #52605A">{{g.label}}</div>
          <sc-for list="{{g.lessons}}" as="l" hint-placeholder-count="5">
            <a href="Player.dc.html" style="{{l.style}}">
              <span style="width: 24px; text-align: right; font-size: 12px; color: #64716B; font-variant-numeric: tabular-nums">{{l.n}}</span>
              <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.part}}</span>
              <span style="font-size: 12px; color: #64716B; font-variant-numeric: tabular-nums">{{l.len}}</span>
              <span style="width: 16px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 16px; color: #C23B2B">{{l.tick}}</span>
            </a>
          </sc-for>
        </sc-for>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { speed: 1, saved: false };
  }
  renderVals() {
    var self = this;
    var speeds = [1, 1.25, 1.5, 2];
    // 每一节：序号、标题、时长、看完的红笔勾；当前一节左侧一条黑板绿竖线
    function lesson(n, part, len, done, on) {
      return {
        n: n, part: part, len: len, tick: done ? '✓' : '',
        style: 'height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 11px; box-sizing: border-box; font-size: 14px;' +
          ' border-left: 3px solid ' + (on ? '#1F5C47' : 'transparent') + '; background: ' + (on ? '#E5F0EA' : 'transparent') +
          '; font-weight: ' + (on ? '600' : '400') + '; color: ' + (on ? '#174636' : '#1C2B26')
      };
    }
    var saved = this.state.saved;
    return {
      speed: this.state.speed + '×',
      speedAria: '播放速度 ' + this.state.speed + ' 倍',
      cycleSpeed: function () { self.setState({ speed: speeds[(speeds.indexOf(self.state.speed) + 1) % speeds.length] }); },
      saveText: saved ? '已收藏' : '收藏',
      saveLabel: saved ? '取消收藏' : '收藏这门课',
      saveColor: saved ? '#C23B2B' : '#1C2B26',
      saveBorder: saved ? '#C23B2B' : '#E2E8E4',
      saveBg: '#FFFFFF',
      saveFill: saved ? '#C23B2B' : 'none',
      toggleSave: function () { self.setState({ saved: !self.state.saved }); },
      groups: [
        { label: '第一章', lessons: [
          lesson(1, '1.1 正数和负数（第1课时）', '17:20', true),
          lesson(2, '1.1 正数和负数（第2课时）', '13:46', true),
          lesson(3, '1.2.1 有理数的概念', '13:02', false, true),
          lesson(4, '1.2.2 数轴', '15:51'),
          lesson(5, '1.2.3 相反数', '14:18'),
          lesson(6, '1.2.4 绝对值', '15:31'),
          lesson(7, '1.2.5 有理数的大小比较', '16:31')
        ] },
        { label: '第二章', lessons: [
          lesson(8, '2.1.1 有理数的加法（第1课时）', '16:51'),
          lesson(9, '2.1.1 有理数的加法（第2课时）', '25:16'),
          lesson(10, '2.1.2 有理数的减法（第1课时）', '19:57'),
          lesson(11, '2.1.2 有理数的减法（第2课时）', '18:06'),
          lesson(12, '2.2.1 有理数的乘法（第1课时）', '21:33')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
