<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Android 播放页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C2B26;text-decoration:none}a:hover{color:#1C2B26}
</style>
</helmet>
<div style="width: 412px; height: 915px; display: flex; flex-direction: column; overflow: hidden; background: #F3F6F3; color: #1C2B26; font-family: Roboto, 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: relative; width: 412px; height: 232px; flex: none; background: #0E1A16">
    <img src="/_blob/1c43bbe290c13f26f32a28f652095afc" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92">
    <a href="PhoneCatalog.dc.html" aria-label="返回" style="position: absolute; top: 8px; left: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: rgba(0,0,0,0.42); color: #FFFFFF">
      <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px 6px; display: flex; align-items: center; gap: 8px; background: linear-gradient(transparent, rgba(14,26,22,0.78)); color: #FFFFFF">
      <button aria-label="暂停" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <span style="font-size: 12px; font-variant-numeric: tabular-nums">04:12</span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 32%; border-radius: 2px; background: #FFFFFF"></span>
      </span>
      <span style="font-size: 12px; font-variant-numeric: tabular-nums">13:02</span>
      <button aria-label="全屏" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div style="flex: none; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 3px">
    <span style="font-size: 12px; color: #64716B">第 3 节，共 56 节</span>
    <h1 style="margin: 0; padding: 1px 0 3px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 21px; font-weight: 400; line-height: 1.4">1.2.1 有理数的概念</h1>
    <p style="margin: 0; font-size: 13px; color: #52605A; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">【56集全】人教版七上数学新教材教学视频合集（初一数学七年级上册）</p>
    <div style="display: flex; gap: 12px; margin-top: 2px; font-size: 12px; color: #64716B"><span>清北李狗蛋</span><span>56 节</span><span>15.3 小时</span><span>360P</span></div>
    <div style="display: flex; gap: 8px; margin-top: 10px; align-items: center">
      <span style="min-height: 44px; padding: 0 18px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid rgba(226,232,228,0.35); border-radius: 12px; background: #FFFFFF; font-size: 14px; font-weight: 500; color: rgba(28,43,38,0.35)">上一节</span>
      <span style="min-height: 44px; padding: 0 18px; display: flex; align-items: center; box-sizing: border-box; border: 1.5px solid #1F5C47; border-radius: 12px; background: #1F5C47; color: #FFFFFF; font-size: 14px; font-weight: 500">下一节</span>
      <button onClick="{{cycleSpeed}}" aria-label="{{speedAria}}" style="min-height: 44px; padding: 0 18px; box-sizing: border-box; border: 1.5px solid #E2E8E4; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #1C2B26">{{speed}}</button>
      <button onClick="{{toggleSave}}" aria-label="{{saveLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 1.5px solid #E2E8E4; border-radius: 12px; background: #FFFFFF; color: {{saveColor}}">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 14px 14px 14px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,43,38,0.05), 0 6px 18px rgba(28,43,38,0.07); overflow: hidden">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 10px">
      <span style="font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 19px">目录</span>
      <span style="font-size: 12px; color: #C23B2B; font-variant-numeric: tabular-nums">已看完 2 / 56</span>
    </div>
    <span style="height: 1px; background: #E2E8E4"></span>
    <div style="flex: 1; min-height: 0; overflow: hidden">
      <div style="padding: 10px 16px 2px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 15px; color: #52605A">第一章</div>
      <sc-for list="{{lessons}}" as="l" hint-placeholder-count="7">
        <a href="PhonePlayer.dc.html" style="{{l.style}}">
          <span style="width: 3px; align-self: stretch; background: {{l.bar}}"></span>
          <span style="width: 34px; padding-right: 8px; text-align: right; font-size: 12px; color: #64716B; font-variant-numeric: tabular-nums">{{l.n}}</span>
          <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{l.part}}</span>
          <span style="padding: 0 8px; font-size: 12px; color: #64716B; font-variant-numeric: tabular-nums">{{l.len}}</span>
          <span style="width: 22px; font-family: 'Kaiti SC', STKaiti, KaiTi, serif; font-size: 15px; color: #C23B2B">{{l.tick}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { speed: 1, saved: false };
  }
  renderVals() {
    var self = this;
    var speeds = [1, 1.25, 1.5, 2];
    // 每一节：序号、标题、时长、看完的红笔勾；当前一节浅绿底加左侧黑板绿竖条
    function lesson(n, part, len, done, on) {
      return {
        n: n, part: part, len: len, tick: done ? '✓' : '',
        bar: on ? '#1F5C47' : 'transparent',
        style: 'display: flex; align-items: center; min-height: 46px; box-sizing: border-box; font-size: 14px;' +
          ' background: ' + (on ? '#E5F0EA' : 'transparent') + '; color: ' + (on ? '#174636' : '#1C2B26') +
          '; font-weight: ' + (on ? '600' : '400')
      };
    }
    var saved = this.state.saved;
    return {
      speed: this.state.speed + '×',
      speedAria: '播放速度 ' + this.state.speed + ' 倍',
      cycleSpeed: function () { self.setState({ speed: speeds[(speeds.indexOf(self.state.speed) + 1) % speeds.length] }); },
      saveLabel: saved ? '取消收藏' : '收藏这门课',
      saveColor: saved ? '#C23B2B' : '#64716B',
      saveFill: saved ? '#C23B2B' : 'none',
      toggleSave: function () { self.setState({ saved: !self.state.saved }); },
      lessons: [
        lesson(1, '1.1 正数和负数（第1课时）', '17:20', true),
        lesson(2, '1.1 正数和负数（第2课时）', '13:46', true),
        lesson(3, '1.2.1 有理数的概念', '13:02', false, true),
        lesson(4, '1.2.2 数轴', '15:51'),
        lesson(5, '1.2.3 相反数', '14:18'),
        lesson(6, '1.2.4 绝对值', '15:31'),
        lesson(7, '1.2.5 有理数的大小比较', '16:31')
      ]
    };
  }
}
</script>
</body>
</html>
